spring:
  application:
    name: rush
  datasource:
    url: jdbc:postgresql://localhost:5432/rush
    username: rush
    password: rush
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        rush.reservation: true
        http.server.requests: true

rush:
  queue:
    # 대기열에서 1초마다 입장시키는 인원
    admit-per-second: 50
    # 입장 후 예매할 수 있는 시간
    admitted-ttl: 5m
