spring:
  application:
    name: rush
  datasource:
    url: jdbc:postgresql://localhost:5432/rush
    username: rush
    password: rush
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        rush.reservation: true
        http.server.requests: true
